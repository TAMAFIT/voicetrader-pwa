<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VoiceTrader</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f8; color: #15171a; }

    h1 { margin: 0 0 16px; font-size: clamp(28px, 6vw, 52px); }
    p { margin: 0; line-height: 1.8; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>VoiceTrader</h1>
    <p>初心者向けの日本語デモトレードPWA。暗号資産とFXを切り替え、Shadow Engineのスコア、AIシグナル、フリーモード、人間対影AIの比較を扱う。現段階は有料APIなし。将来Local AI Providerを差し替え可能な構造にする。</p>
  </main>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");</script>
</body>
</html>
