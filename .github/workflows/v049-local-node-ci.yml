name: Local Edge Lab Manual CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate Local Node source
        run: |
          node --check src/short-horizon/local-node-gmo-tick.js
          node --check scripts/local-node/gmo-fx-tick-recorder.mjs
          node scripts/test-short-horizon-local-node.mjs
          node --check src/short-horizon/local-node-kraken-wire.js
          node --check scripts/local-node/kraken-microstructure-recorder.mjs
          node scripts/test-short-horizon-local-node-kraken.mjs
          node --check src/short-horizon/local-node-coinbase-wire.js
          node --check src/short-horizon/coinbase-book-integrity.js
          node --check src/short-horizon/coinbase-microstructure-features.js
          node --check src/short-horizon/coinbase-boundary-windows.js
          node --check src/short-horizon/cross-venue-replication.js
          node --check src/short-horizon/cross-venue-preregistered-hypothesis.js
          node --check src/short-horizon/cross-venue-learning-scorecard.js
          node --check src/short-horizon/cross-venue-blind-manifest.js
          node --check src/short-horizon/cross-venue-blind-reveal.js
          node --check src/short-horizon/cross-venue-blind-stability.js
          node --check scripts/local-node/coinbase-microstructure-recorder.mjs
          node --check scripts/local-node/coinbase-boundary-window-worker.mjs
          node --check scripts/local-node/cross-venue-replication-worker.mjs
          node --check scripts/local-node/cross-venue-preregistered-worker.mjs
          node --check scripts/local-node/cross-venue-learning-scorecard-worker.mjs
          node scripts/test-short-horizon-local-node-coinbase.mjs
          node scripts/test-short-horizon-coinbase-book-integrity.mjs
          node scripts/test-short-horizon-coinbase-microstructure-features.mjs
          node scripts/test-short-horizon-coinbase-provider-windows.mjs
          node scripts/test-short-horizon-cross-venue-replication.mjs
          node scripts/test-short-horizon-cross-venue-replication-worker.mjs
          node scripts/test-short-horizon-cross-venue-preregistered.mjs
          node scripts/test-short-horizon-cross-venue-preregistered-worker.mjs
          node scripts/test-short-horizon-cross-venue-learning-scorecard.mjs
          node scripts/test-short-horizon-cross-venue-learning-scorecard-worker.mjs
          node scripts/test-short-horizon-cross-venue-blind-manifest.mjs
          node scripts/test-short-horizon-cross-venue-blind-reveal.mjs
          node scripts/test-short-horizon-cross-venue-blind-stability.mjs

      - name: Assert cloud-cost and execution boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q "googleCloudEnabled:false" src/short-horizon/local-node-gmo-tick.js
          grep -q "cloudUploadEnabled:false" src/short-horizon/local-node-gmo-tick.js
          grep -q "githubActionsRequired:false" src/short-horizon/local-node-gmo-tick.js
          grep -q "authenticationRequired:false" src/short-horizon/local-node-coinbase-wire.js
          grep -q "predictionInputAuthorized:false" src/short-horizon/local-node-coinbase-wire.js
          grep -q "predictionInputAuthorized:false" src/short-horizon/coinbase-microstructure-features.js
          grep -q "predictionInputAuthorized:false" src/short-horizon/coinbase-boundary-windows.js
          grep -q "predictionInputAuthorized:false" src/short-horizon/cross-venue-replication.js
          grep -q "predictionInputAuthorized:false" src/short-horizon/cross-venue-preregistered-hypothesis.js
          grep -q "predictionInputAuthorized:false" src/short-horizon/cross-venue-learning-scorecard.js
          grep -q "predictionInputAuthorized:false" src/short-horizon/cross-venue-blind-manifest.js
          grep -q "predictionInputAuthorized:false" src/short-horizon/cross-venue-blind-reveal.js
          grep -q "predictionInputAuthorized:false" src/short-horizon/cross-venue-blind-stability.js
          grep -q "adaptiveLearningAuthorized:false" src/short-horizon/cross-venue-preregistered-hypothesis.js
          grep -q "adaptiveLearningAuthorized:false" src/short-horizon/cross-venue-blind-manifest.js
          grep -q "adaptiveLearningAuthorized:false" src/short-horizon/cross-venue-blind-reveal.js
          grep -q "adaptiveLearningAuthorized:false" src/short-horizon/cross-venue-blind-stability.js
          grep -q "blindResultsConsumed:false" src/short-horizon/cross-venue-learning-scorecard.js
          grep -q "resultsAccessed:false" src/short-horizon/cross-venue-blind-manifest.js
          grep -q "selectionUsesResultValues:false" src/short-horizon/cross-venue-blind-manifest.js
          grep -q "sequentialPeekingAllowed:false" src/short-horizon/cross-venue-blind-reveal.js
          grep -q "noTopUpAfterReveal:true" src/short-horizon/cross-venue-blind-reveal.js
          grep -q "noIidSignificanceClaim:true" src/short-horizon/cross-venue-blind-stability.js
          grep -q "actualNetEvAvailable:false" src/short-horizon/cross-venue-blind-stability.js
          grep -q "orderSubmission:false" src/short-horizon/local-node-coinbase-wire.js
          if grep -R -E "@google-cloud|googleapis|storage\.googleapis|run\.app|pubsub|bigquery" \
            src/short-horizon/local-node-gmo-tick.js \
            scripts/local-node/gmo-fx-tick-recorder.mjs \
            src/short-horizon/local-node-kraken-wire.js \
            scripts/local-node/kraken-microstructure-recorder.mjs \
            src/short-horizon/local-node-coinbase-wire.js \
            src/short-horizon/coinbase-book-integrity.js \
            src/short-horizon/coinbase-microstructure-features.js \
            src/short-horizon/coinbase-boundary-windows.js \
            src/short-horizon/cross-venue-replication.js \
            src/short-horizon/cross-venue-preregistered-hypothesis.js \
            src/short-horizon/cross-venue-learning-scorecard.js \
            src/short-horizon/cross-venue-blind-manifest.js \
            src/short-horizon/cross-venue-blind-reveal.js \
            src/short-horizon/cross-venue-blind-stability.js \
            scripts/local-node/coinbase-microstructure-recorder.mjs \
            scripts/local-node/coinbase-boundary-window-worker.mjs \
            scripts/local-node/cross-venue-replication-worker.mjs \
            scripts/local-node/cross-venue-preregistered-worker.mjs \
            scripts/local-node/cross-venue-learning-scorecard-worker.mjs; then
            echo 'Unexpected Google Cloud dependency or endpoint in Local Node runtime.' >&2
            exit 1
          fi
