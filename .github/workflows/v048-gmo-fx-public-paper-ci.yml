name: VoiceTrader v0.48 GMO FX Public Quote/Paper CI

on:
  pull_request:
    paths:
      - 'docs/SHORT_HORIZON_GMO_PUBLIC_EXECUTION.md'
      - 'src/short-horizon/gmo-fx-public-quote.js'
      - 'src/short-horizon/gmo-paper-execution.js'
      - 'scripts/lib/short-horizon-gmo-quote-archive.mjs'
      - 'scripts/lib/short-horizon-gmo-paper-archive.mjs'
      - 'scripts/collect-short-horizon-gmo-quotes.mjs'
      - 'scripts/collect-short-horizon-gmo-paper.mjs'
      - 'scripts/test-gmo-fx-public-paper.mjs'
      - 'scripts/validate-gmo-fx-public-paper.mjs'
      - '.github/workflows/short-horizon-gmo-quote-collector.yml'
      - '.github/workflows/short-horizon-gmo-paper-collector.yml'
      - '.github/workflows/v048-gmo-fx-public-paper-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/short-horizon/gmo-fx-public-quote.js'
      - 'src/short-horizon/gmo-paper-execution.js'
      - 'scripts/lib/short-horizon-gmo-quote-archive.mjs'
      - 'scripts/lib/short-horizon-gmo-paper-archive.mjs'
      - 'scripts/collect-short-horizon-gmo-quotes.mjs'
      - 'scripts/collect-short-horizon-gmo-paper.mjs'
      - '.github/workflows/short-horizon-gmo-quote-collector.yml'
      - '.github/workflows/short-horizon-gmo-paper-collector.yml'
      - '.github/workflows/v048-gmo-fx-public-paper-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: v0.48 syntax checks
        run: |
          node --check src/short-horizon/gmo-fx-public-quote.js
          node --check src/short-horizon/gmo-paper-execution.js
          node --check scripts/lib/short-horizon-gmo-quote-archive.mjs
          node --check scripts/lib/short-horizon-gmo-paper-archive.mjs
          node --check scripts/collect-short-horizon-gmo-quotes.mjs
          node --check scripts/collect-short-horizon-gmo-paper.mjs
          node --check scripts/test-gmo-fx-public-paper.mjs
          node --check scripts/validate-gmo-fx-public-paper.mjs

      - name: v0.48 deterministic quote and paper tests
        run: node scripts/test-gmo-fx-public-paper.mjs

      - name: v0.48 provider and execution guardrails
        run: node scripts/validate-gmo-fx-public-paper.mjs

      - name: v0.47 OANDA read-only regression
        run: |
          node scripts/test-oanda-v20-readonly.mjs
          node scripts/validate-oanda-v20-readonly.mjs

      - name: v0.46 deployability regression
        run: |
          node scripts/test-short-horizon-deployability.mjs
          node scripts/validate-short-horizon-deployability.mjs

      - name: v0.45 cost regression
        run: |
          node scripts/test-short-horizon-cost-analysis.mjs
          node scripts/validate-short-horizon-cost-analysis.mjs

      - name: v0.44 outcome regression
        run: |
          node scripts/test-short-horizon-outcomes.mjs
          node scripts/validate-short-horizon-outcomes.mjs

      - name: v0.43 signal regression
        run: |
          node scripts/test-short-horizon-prospective-signals.mjs
          node scripts/validate-short-horizon-prospective-signals.mjs

      - name: v0.42 Human Canon regression
        run: |
          node scripts/test-short-horizon-human-canon.mjs
          node scripts/test-short-horizon-signal-contract.mjs
          node scripts/validate-short-horizon-human-canon.mjs

      - name: v0.41 FX foundation regression
        run: |
          node scripts/test-short-horizon-dukascopy-fx.mjs
          node scripts/test-short-horizon-fx-archive.mjs
          node scripts/validate-short-horizon-fx-foundation.mjs

      - name: v0.40 crypto foundation regression
        run: |
          node scripts/test-short-horizon-market-event.mjs
          node scripts/test-short-horizon-kraken-ohlc.mjs
          node scripts/test-short-horizon-archive.mjs
          node scripts/validate-short-horizon-foundation.mjs

      - name: Legacy v0.39 release guardrail remains intact
        run: node scripts/validate-v039-release-integrity.mjs
