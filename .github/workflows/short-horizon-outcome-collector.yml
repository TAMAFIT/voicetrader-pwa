name: Short-Horizon Prospective Outcome Collector

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/short-horizon-outcome-collector.yml'
      - 'src/short-horizon/market-event.js'
      - 'src/short-horizon/kraken-ohlc.js'
      - 'src/short-horizon/dukascopy-fx.js'
      - 'src/short-horizon/signal-contract.js'
      - 'src/short-horizon/outcome-contract.js'
      - 'scripts/lib/short-horizon-signal-reader.mjs'
      - 'scripts/lib/short-horizon-outcome-archive.mjs'
      - 'scripts/collect-short-horizon-outcomes.mjs'

permissions:
  contents: write

concurrency:
  group: short-horizon-outcome-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout outcome collector code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pinned Dukascopy public-datafeed adapter dependency
        shell: bash
        run: npm install --no-save --package-lock=false --ignore-scripts dukascopy-node@1.50.0

      - name: Checkout immutable prospective signal evidence
        uses: actions/checkout@v6
        with:
          ref: short-horizon-signal-data
          path: _short_horizon_signal_data
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout generated outcome branch
        uses: actions/checkout@v6
        with:
          ref: short-horizon-outcome-data
          path: _short_horizon_outcome_data
          fetch-depth: 1

      - name: Mature eligible primary and secondary horizons
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          node scripts/collect-short-horizon-outcomes.mjs
          --signal-root _short_horizon_signal_data
          --outcome-root _short_horizon_outcome_data

      - name: Commit generated outcome evidence only
        working-directory: _short_horizon_outcome_data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VoiceTrader Outcome Collector'
          git config user.email 'actions@users.noreply.github.com'
          git add -- data/short-horizon-outcomes
          if git diff --cached --quiet; then
            echo 'No short-horizon outcome evidence change.'
            exit 0
          fi
          git commit -m 'Update short-horizon prospective outcomes'
          git push origin HEAD:short-horizon-outcome-data

      - name: Surface total provider failure after preserving health evidence
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('_short_horizon_outcome_data/data/short-horizon-outcomes/manifest.json', 'utf8'));
          console.log(JSON.stringify(manifest.lastRun, null, 2));
          if (manifest.lastRun?.status === 'fail') process.exit(1);
          NODE
