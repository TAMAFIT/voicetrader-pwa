name: Model Adapter Environment Preparation

on:
  workflow_dispatch:
    inputs:
      experiment_id:
        description: 'Human-approved active FROZEN experiment id'
        required: true
        type: string
      revision:
        description: 'Optional explicit FROZEN revision'
        required: false
        type: string
      expected_semantic_fingerprint:
        description: 'Exact FROZEN semantic fingerprint'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: model-adapter-environment-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require manual invocation from main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main' || { echo 'Adapter preparation must be dispatched from main.'; exit 1; }

      - name: Checkout current orchestration code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Checkout lifecycle source of truth
        uses: actions/checkout@v6
        with:
          ref: model-experiment-lifecycle-data
          path: _lifecycle
          fetch-depth: 1

      - name: Resolve exact FROZEN identity
        shell: bash
        env:
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          REVISION: ${{ inputs.revision }}
          EXPECTED_SEMANTIC_FINGERPRINT: ${{ inputs.expected_semantic_fingerprint }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const ledger=JSON.parse(fs.readFileSync('_lifecycle/data/model-experiment-lifecycle-v1.json','utf8'));
          if(ledger.audit?.pass!==true)throw new Error('persisted-lifecycle-audit-not-pass');
          const revision=process.env.REVISION?Number(process.env.REVISION):null;
          const states=(ledger.audit.effectiveStates||[]).filter(state=>state.experimentId===process.env.EXPERIMENT_ID&&state.effectiveStatus==='FROZEN'&&(revision===null||Number(state.revision)===revision));
          if(states.length!==1)throw new Error(states.length?'ambiguous-active-frozen':'active-frozen-spec-not-found');
          const spec=(ledger.frozenSpecs||[]).find(item=>item.experimentId===process.env.EXPERIMENT_ID&&Number(item.revision)===Number(states[0].revision));
          if(!spec)throw new Error('frozen-spec-snapshot-missing');
          if(spec.semanticFingerprint!==process.env.EXPECTED_SEMANTIC_FINGERPRINT)throw new Error('expected-semantic-fingerprint-mismatch');
          fs.appendFileSync(process.env.GITHUB_ENV,[`FROZEN_DATASET_SHA=${spec.dataset.commitSha}`,`FROZEN_CODE_SHA=${spec.environment.codeCommit}`,`FROZEN_REVISION=${spec.revision}`,`FROZEN_SEMANTIC_FINGERPRINT=${spec.semanticFingerprint}`].join('\n')+'\n');
          NODE

      - name: Checkout exact frozen Experience dataset
        uses: actions/checkout@v6
        with:
          ref: ${{ env.FROZEN_DATASET_SHA }}
          path: _experience
          fetch-depth: 1

      - name: Switch contracts to exact frozen code commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$FROZEN_CODE_SHA"
          for file in scripts/model-worker-handoff-cli.mjs scripts/model-feature-matrix-cli.mjs scripts/model-feature-matrix-conformance-cli.mjs scripts/model_feature_matrix_conformance.py scripts/model-execution-envelope-cli.mjs scripts/model-adapter-preparation-cli.mjs scripts/model_adapter_environment_probe.py; do
            test -f "$file" || { echo "Frozen code commit predates adapter preparation contract: $file"; exit 1; }
          done

      - name: Resolve exact heads
        shell: bash
        run: |
          set -euo pipefail
          echo "ACTUAL_CODE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "ACTUAL_DATASET_COMMIT=$(git -C _experience rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "ACTUAL_LIFECYCLE_COMMIT=$(git -C _lifecycle rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build exact handoff manifest
        shell: bash
        env:
          LEDGER_PATH: _lifecycle/data/model-experiment-lifecycle-v1.json
          DATASET_PATH: _experience/data/prospective-experience-v1.json
          ACTUAL_DATASET_COMMIT: ${{ env.ACTUAL_DATASET_COMMIT }}
          ACTUAL_CODE_COMMIT: ${{ env.ACTUAL_CODE_COMMIT }}
          ACTUAL_LIFECYCLE_COMMIT: ${{ env.ACTUAL_LIFECYCLE_COMMIT }}
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          REVISION: ${{ env.FROZEN_REVISION }}
          EXPECTED_SEMANTIC_FINGERPRINT: ${{ env.FROZEN_SEMANTIC_FINGERPRINT }}
          HANDOFF_OUTPUT_PATH: /tmp/model-worker-handoff-manifest.json
        run: node scripts/model-worker-handoff-cli.mjs >/dev/null

      - name: Build deterministic matrix bundle
        shell: bash
        env:
          MANIFEST_PATH: /tmp/model-worker-handoff-manifest.json
          DATASET_PATH: _experience/data/prospective-experience-v1.json
          ACTUAL_DATASET_COMMIT: ${{ env.ACTUAL_DATASET_COMMIT }}
          MATRIX_OUTPUT_PATH: /tmp/model-feature-matrix-bundle.json
        run: node scripts/model-feature-matrix-cli.mjs >/dev/null

      - name: Build JS and Python preprocessing conformance
        shell: bash
        run: |
          set -euo pipefail
          MATRIX_BUNDLE_PATH=/tmp/model-feature-matrix-bundle.json CONFORMANCE_OUTPUT_PATH=/tmp/js-conformance.json node scripts/model-feature-matrix-conformance-cli.mjs >/dev/null
          python3 scripts/model_feature_matrix_conformance.py --manifest /tmp/model-worker-handoff-manifest.json --dataset _experience/data/prospective-experience-v1.json --dataset-commit "$ACTUAL_DATASET_COMMIT" --output /tmp/python-conformance.json >/dev/null
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const js=JSON.parse(fs.readFileSync('/tmp/js-conformance.json','utf8')),py=JSON.parse(fs.readFileSync('/tmp/python-conformance.json','utf8'));
          if(js.wire!==py.wire||js.conformanceFingerprint!==py.conformanceFingerprint)throw new Error('preprocessing-cross-runtime-conformance-failed');
          NODE

      - name: Prepare immutable execution envelope
        shell: bash
        env:
          MANIFEST_PATH: /tmp/model-worker-handoff-manifest.json
          MATRIX_BUNDLE_PATH: /tmp/model-feature-matrix-bundle.json
          JS_CONFORMANCE_PATH: /tmp/js-conformance.json
          PYTHON_CONFORMANCE_PATH: /tmp/python-conformance.json
          ENVELOPE_OUTPUT_PATH: /tmp/model-execution-envelope.json
        run: node scripts/model-execution-envelope-cli.mjs >/dev/null

      - name: Probe Python runtime metadata only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/model_adapter_environment_probe.py | tee /tmp/model-runtime-probe.json

      - name: Evaluate adapter and lock prerequisites
        id: adapter
        shell: bash
        env:
          ENVELOPE_PATH: /tmp/model-execution-envelope.json
          PREPARATION_OUTPUT_PATH: /tmp/model-adapter-preparation.json
        run: |
          set -euo pipefail
          node scripts/model-adapter-preparation-cli.mjs | tee /tmp/model-adapter-preparation-summary.json
          {
            echo '### Model Adapter / Environment Preparation — BLOCKED'
            echo '```json'
            cat /tmp/model-adapter-preparation-summary.json
            echo '```'
            echo ''
            echo 'Runtime probe is metadata-only. No dependency resolution, package installation, model import, fit, predict, evaluation, result production, or execution authorization occurs.'
          } >> "$GITHUB_STEP_SUMMARY"
