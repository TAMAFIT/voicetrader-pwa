name: Knowledge Forward Collector

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knowledge-forward-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout collector code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Checkout generated data branch
        uses: actions/checkout@v6
        with:
          ref: knowledge-forward-data
          path: _knowledge_forward_data
          fetch-depth: 1

      - name: Pin frozen knowledge-forward evaluator
        shell: bash
        run: |
          set -euo pipefail
          FROZEN='1af623dfa7df53618733050ff9edab5e3595a3d0'
          git checkout "$FROZEN" -- \
            src/config.js \
            src/engine \
            src/knowledge \
            src/research/knowledge-candidate-registry.js \
            src/research/knowledge-candidate-tournament.js \
            src/research/research-cost-model.js \
            src/research/knowledge-forward-epoch.js \
            src/research/knowledge-forward-runner.js \
            src/research/knowledge-forward-store.js
          git diff --exit-code "$FROZEN" -- \
            src/config.js \
            src/engine \
            src/knowledge \
            src/research/knowledge-candidate-registry.js \
            src/research/knowledge-candidate-tournament.js \
            src/research/research-cost-model.js \
            src/research/knowledge-forward-epoch.js \
            src/research/knowledge-forward-runner.js \
            src/research/knowledge-forward-store.js

      - name: Collect Kraken 4H and update prospective evidence
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/collect-knowledge-forward.mjs --archive _knowledge_forward_data/data/knowledge-forward-001.json

      - name: Commit generated evidence only when changed
        working-directory: _knowledge_forward_data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VoiceTrader Collector'
          git config user.email 'actions@users.noreply.github.com'
          git add -- data/knowledge-forward-001.json
          if git diff --cached --quiet; then
            echo 'No generated data change.'
            exit 0
          fi
          git commit -m 'Update knowledge-forward-001 evidence'
          git push origin HEAD:knowledge-forward-data
