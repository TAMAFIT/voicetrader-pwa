name: VoiceTrader v0.43 Short-Horizon Prospective Signals CI

on:
  pull_request:
    paths:
      - 'docs/SHORT_HORIZON_EXPANSION.md'
      - 'src/short-horizon/**'
      - 'scripts/lib/short-horizon-signal-archive.mjs'
      - 'scripts/collect-short-horizon-signals.mjs'
      - 'scripts/test-short-horizon-prospective-signals.mjs'
      - 'scripts/validate-short-horizon-prospective-signals.mjs'
      - '.github/workflows/short-horizon-prospective-signal-collector.yml'
      - '.github/workflows/v043-short-horizon-prospective-signals-ci.yml'
  push:
    branches: [main]
    paths:
      - 'docs/SHORT_HORIZON_EXPANSION.md'
      - 'src/short-horizon/**'
      - 'scripts/lib/short-horizon-signal-archive.mjs'
      - 'scripts/collect-short-horizon-signals.mjs'
      - 'scripts/test-short-horizon-prospective-signals.mjs'
      - 'scripts/validate-short-horizon-prospective-signals.mjs'
      - '.github/workflows/short-horizon-prospective-signal-collector.yml'
      - '.github/workflows/v043-short-horizon-prospective-signals-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: v0.43 syntax checks
        run: |
          node --check src/short-horizon/session-context.js
          node --check src/short-horizon/freshness-gate.js
          node --check src/short-horizon/prospective-signal-runner.js
          node --check scripts/lib/short-horizon-signal-archive.mjs
          node --check scripts/collect-short-horizon-signals.mjs
          node --check scripts/test-short-horizon-prospective-signals.mjs
          node --check scripts/validate-short-horizon-prospective-signals.mjs

      - name: v0.43 deterministic prospective runtime tests
        run: node scripts/test-short-horizon-prospective-signals.mjs

      - name: v0.43 architecture and execution guardrails
        run: node scripts/validate-short-horizon-prospective-signals.mjs

      - name: v0.42 Human Canon regression
        run: |
          node scripts/test-short-horizon-human-canon.mjs
          node scripts/test-short-horizon-signal-contract.mjs
          node scripts/validate-short-horizon-human-canon.mjs

      - name: v0.41 FX foundation regression
        run: |
          node scripts/test-short-horizon-dukascopy-fx.mjs
          node scripts/test-short-horizon-fx-archive.mjs
          node scripts/validate-short-horizon-fx-foundation.mjs

      - name: v0.40 crypto foundation regression
        run: |
          node scripts/test-short-horizon-market-event.mjs
          node scripts/test-short-horizon-kraken-ohlc.mjs
          node scripts/test-short-horizon-archive.mjs
          node scripts/validate-short-horizon-foundation.mjs

      - name: Legacy v0.39 release guardrail remains intact
        run: node scripts/validate-v039-release-integrity.mjs
