name: Short-Horizon GMO FX Paper Execution Collector

on:
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/short-horizon-gmo-paper-collector.yml'
      - 'src/short-horizon/gmo-paper-execution.js'
      - 'scripts/lib/short-horizon-gmo-paper-archive.mjs'
      - 'scripts/collect-short-horizon-gmo-paper.mjs'

permissions:
  contents: write

concurrency:
  group: short-horizon-gmo-paper-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout v0.48 code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Checkout prospective signals
        uses: actions/checkout@v6
        with:
          ref: short-horizon-signal-data
          path: _short_horizon_signal_data
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout GMO public quote evidence
        uses: actions/checkout@v6
        with:
          ref: short-horizon-gmo-quote-data
          path: _short_horizon_gmo_quote_data
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout generated GMO paper branch
        uses: actions/checkout@v6
        with:
          ref: short-horizon-gmo-paper-data
          path: _short_horizon_gmo_paper_data
          fetch-depth: 1

      - name: Mature quote-side paper executions when evidence exists
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          node scripts/collect-short-horizon-gmo-paper.mjs
          --signal-root _short_horizon_signal_data
          --quote-root _short_horizon_gmo_quote_data
          --paper-root _short_horizon_gmo_paper_data

      - name: Commit generated paper evidence only
        working-directory: _short_horizon_gmo_paper_data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VoiceTrader GMO Paper Collector'
          git config user.email 'actions@users.noreply.github.com'
          git add -- data/short-horizon-gmo-paper
          if git diff --cached --quiet; then
            echo 'No GMO paper evidence change.'
            exit 0
          fi
          git commit -m 'Update GMO FX paper execution evidence'
          git push origin HEAD:short-horizon-gmo-paper-data

      - name: Surface paper manifest
        shell: bash
        run: |
          if [ -f _short_horizon_gmo_paper_data/data/short-horizon-gmo-paper/manifest.json ]; then
            cat _short_horizon_gmo_paper_data/data/short-horizon-gmo-paper/manifest.json
          fi
