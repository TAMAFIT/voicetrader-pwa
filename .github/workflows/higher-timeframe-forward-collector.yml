name: Higher Timeframe Forward Collector

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/higher-timeframe-forward-collector.yml'
      - 'scripts/collect-higher-timeframe-forward.mjs'
      - 'src/research/autonomous-higher-timeframe-forward-collector.js'
      - 'src/research/higher-timeframe-forward-epoch.js'
      - 'src/research/higher-timeframe-forward-runner.js'
      - 'src/research/higher-timeframe-forward-store.js'
      - 'src/research/higher-timeframe-forward-remote.js'
      - 'src/research/higher-timeframe-forward-replay-audit.js'
      - 'src/research/prospective-attribution-ledger.js'
      - 'src/research/higher-timeframe-prospective-attribution.js'

permissions:
  contents: write

concurrency:
  group: higher-timeframe-forward-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout collector code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Checkout generated data branch
        uses: actions/checkout@v6
        with:
          ref: higher-timeframe-forward-data
          path: _higher_timeframe_forward_data
          fetch-depth: 1

      - name: Pin frozen Wave3 evaluator
        shell: bash
        run: |
          set -euo pipefail
          FROZEN='c8fdedb9b385d1d01f7c69948a2520882388a337'
          FROZEN_PATHS=(
            src/config.js
            src/engine/ai-provider.js
            src/engine/decision-policy.js
            src/engine/execution-engine.js
            src/engine/experts.js
            src/engine/indicators.js
            src/engine/shadow-engine.js
            src/knowledge/knowledge-indicators.js
            src/knowledge/playbook-features.js
            src/knowledge/higher-timeframe-registry.js
            src/knowledge/higher-timeframe-features.js
            src/knowledge/higher-timeframe-engine.js
            src/research/research-cost-model.js
          )
          git checkout "$FROZEN" -- "${FROZEN_PATHS[@]}"
          git diff --exit-code "$FROZEN" -- "${FROZEN_PATHS[@]}"

      - name: Collect Kraken 4H and update HTF prospective evidence
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/collect-higher-timeframe-forward.mjs --archive _higher_timeframe_forward_data/data/htf-forward-001.json

      - name: Commit generated HTF evidence only when changed
        working-directory: _higher_timeframe_forward_data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VoiceTrader HTF Collector'
          git config user.email 'actions@users.noreply.github.com'
          git add -- data/htf-forward-001.json
          if git diff --cached --quiet; then
            echo 'No generated HTF data change.'
            exit 0
          fi
          git commit -m 'Update htf-forward-001 evidence'
          git push origin HEAD:higher-timeframe-forward-data
